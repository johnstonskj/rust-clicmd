[package]
name = "clicmd"
description = "This crate provides some composable components for command-line applications."
version = "0.1.2"
edition = "2024"
repository = "https://github.com/johnstonskj/clicmd"
homepage = "https://simonkjohnston.life/clicmd"
license = "MIT OR Apache-2.0"
keywords = ["cli"]
readme = "README.md"
publish = true

[features]
default = ["color", "completion", "external", "messages", "verbosity"]

## Add color support
color = []

## Add support for generation of shell completion scripts.
completion = ["clap_complete"]

## Add external command support such as that provided by `cargo` or `git`.
external = []

## Support for human-facing error messages.
messages = ["color", "strum"]

## Support for verbosity flags and tracing initialization.
verbosity = []

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = { version = "4.6", optional = true }
clap-verbosity-flag = { version = "3", default-features = false, features = [
    "tracing",
] }
colorchoice = { version = "1.0" }
colorchoice-clap = { version = "1.0" }
colored = { version = "3.1" }
document-features = "0.2"
search_path = "0.1"
thiserror = { version = "2.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strum = { version = "0.28", features = ["derive"], optional = true }

[[example]]
name = "single"
path = "examples/single/src/main.rs"

[[example]]
name = "multi"
path = "examples/multi/src/main.rs"
